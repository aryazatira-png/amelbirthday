<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Gesture Particle Control</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: Arial, sans-serif; }
        #webcam { position: absolute; bottom: 20px; left: 20px; width: 180px; height: 135px; border: 2px solid #00ffcc; border-radius: 8px; transform: scaleX(-1); z-index: 10; background-color: #111; }
        #error-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #ff4444; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px; font-size: 16px; display: none; text-align: center; z-index: 100; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="error-msg">⚠️ Kamera tidak terdeteksi atau izin akses kamera ditolak!<br>Mohon izinkan akses kamera pada browser Anda.</div>
    <video id="webcam" autoplay playsinline muted></video>

    <script>
        const PARTICLE_COUNT = 8000;
        let scene, camera, renderer, particles, geometry;
        let targetPositions = new Float32Array(PARTICLE_COUNT * 3);
        let activeShapeIndex = 0;

        // --- Fungsi Generator Bentuk ---
        
        function getFireworksPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                const r = Math.random() * 5; 
                pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i * 3 + 2] = r * Math.cos(phi);
            }
            return pos;
        }

        function getHeartPositions() {
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const t = Math.random() * Math.PI * 2;
                const u = Math.random() * Math.PI - Math.PI / 2;
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                pos[i * 3] = x * 0.3; pos[i * 3 + 1] = y * 0.3; pos[i * 3 + 2] = u * 0.3;
            }
            return pos;
        }

        function getTextPositions(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 800; canvas.height = 150;
            ctx.fillStyle = 'black'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white'; ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center'; ctx.fillText(text, 400, 85);
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const validPixels = [];
            for (let y = 0; y < canvas.height; y += 2) {
                for (let x = 0; x < canvas.width; x += 2) {
                    if (imgData.data[(y * canvas.width + x) * 4] > 128) {
                        validPixels.push({ x: (x - canvas.width / 2) * 0.03, y: -(y - canvas.height / 2) * 0.03 });
                    }
                }
            }
            const pos = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const pt = validPixels[i % validPixels.length];
                pos[i * 3] = pt.x; pos[i * 3 + 1] = pt.y; pos[i * 3 + 2] = (Math.random() - 0.5) * 0.1;
            }
            return pos;
        }

        // Inisialisasi Data
        const shapes = [ getFireworksPositions(), getHeartPositions(), getTextPositions('ameliaa oktaa'), getTextPositions('Happy birthdaay') ];

        function initThreeJS() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(PARTICLE_COUNT * 3), 3));
            particles = new THREE.Points(geometry, new THREE.PointsMaterial({ size: 0.06, color: 0xffffff, blending: THREE.AdditiveBlending, transparent: true }));
            scene.add(particles);
            
            // Set initial position
            targetPositions.set(shapes[0]);
            geometry.attributes.position.array.set(shapes[0]);
            
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const positions = geometry.attributes.position.array;
            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                positions[i] += (targetPositions[i] - positions[i]) * 0.1;
            }
            geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 1. Logika Gestur
                const isIndexOpen = landmarks[8].y < landmarks[6].y;
                const isMiddleOpen = landmarks[12].y < landmarks[10].y;
                const isRingOpen = landmarks[16].y < landmarks[14].y;
                const isPinkyOpen = landmarks[20].y < landmarks[18].y;

                if (isIndexOpen && isMiddleOpen && !isRingOpen && !isPinkyOpen) activeShapeIndex = 3; // HBD
                else if (isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) activeShapeIndex = 2; // Amelia
                else if (!isIndexOpen && !isMiddleOpen && !isRingOpen && !isPinkyOpen) activeShapeIndex = 1; // Love
                else activeShapeIndex = 0; // Fireworks

                targetPositions.set(shapes[activeShapeIndex]);

                // 2. Logika Rotasi (Mengikuti tangan)
                const wrist = landmarks[0];
                const middleKnuckle = landmarks[9];
                const angle = Math.atan2(middleKnuckle.y - wrist.y, middleKnuckle.x - wrist.x);
                // Rotasi Z disesuaikan agar objek "menghadap" ke atas sesuai putaran tangan
                particles.rotation.z = -angle - Math.PI/2; 
            }
        }

        const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        hands.onResults(onResults);

        navigator.mediaDevices.getUserMedia({ video: true }).then((stream) => {
            const video = document.getElementById('webcam');
            video.srcObject = stream;
            new Camera(video, { onFrame: async () => await hands.send({ image: video }), width: 480, height: 360 }).start();
        }).catch(() => { document.getElementById('error-msg').style.display = 'block'; });

        initThreeJS();
    </script>
</body>
</html>
